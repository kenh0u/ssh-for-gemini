[package]
name = "ssh-for-gemini"
version = "0.1.0"
edition = "2021"
description = "SSH for Gemini: pure HTTP POST/GET <-> local TCP (SSH) bridge daemon for Gemini Task mode"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kenh0u/ssh-for-gemini"
keywords = ["ssh", "gemini", "http", "tunnel", "cloudflare"]
categories = ["network-programming", "command-line-utilities"]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
